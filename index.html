    function calcSleepType(records) {
      if(records.length<5) return null;
      const avg = records.reduce((a,r)=>a+(r.sleep_hours||0),0)/records.length;
      const bts=records.map(r=>parseInt(r.bed_time)).filter(Boolean);
      const wts=records.map(r=>parseInt(r.wake_time)).filter(Boolean);
      const rhythmBroken=bts.length>1&&Math.max(...bts)-Math.min(...bts)>=3;
      const lateNight=bts.length>1&&bts.reduce((a,b)=>a+b,0)/bts.length>=1;
      const earlyBird=bts.length>1&&bts.reduce((a,b)=>a+b,0)/bts.length<=22&&wts.reduce((a,b)=>a+b,0)/wts.length<=6;
      const phoneRecords=records.filter(r=>r.phone);
      const phoneAddict=phoneRecords.length>=3&&phoneRecords.filter(r=>r.phone==='long').length/phoneRecords.length>=0.6;
      const cafRecords=records.filter(r=>r.caffeine);
      const cafSensitive=cafRecords.length>=3&&cafRecords.filter(r=>r.caffeine==='evening').length/cafRecords.length>=0.6;
      const focusRecords=records.filter(r=>r.focus);
      const avgFocusNum=focusRecords.length?focusRecords.reduce((a,r)=>a+r.focus,0)/focusRecords.length:3;
      if(avg<=5.5) return ALL_TYPES[0];
      if(avg<=6.5&&lateNight) return ALL_TYPES[1];
      if(avg<=6.5) return ALL_TYPES[2];
      if(avg>=9) return ALL_TYPES[3];
      if(avg>=8) return ALL_TYPES[4];
      if(earlyBird) return ALL_TYPES[5];
      if(rhythmBroken&&phoneAddict) return ALL_TYPES[6];
      if(rhythmBroken) return ALL_TYPES[7];
      if(cafSensitive) return ALL_TYPES[8];
      if(avgFocusNum>=4) return ALL_TYPES[9];
      return ALL_TYPES[10];
    }

      const { data, error } = await supabaseClient.from('records').select('user_name');

      const users = [...new Set(data.map(r=>r.user_name))];
      return users;

    const sbGetAllRecords = async () => {
      const { data, error } = await supabaseClient.from('records').select('*').order('date', { ascending: false });
      if(error) return [];
      return data || [];
    };

    const sbCheckAuth = async (userName, pw) => {
      const hash = await hashPw(pw);
      const { data } = await supabaseClient.from('records').select('user_name').eq('user_name', userName).limit(1);
      // 認証情報をlocalStorageで管理
      const stored = localStorage.getItem(`sc-auth:${userName.toLowerCase()}`);
      return stored === hash;
    };

    const sbRegister = async (userName, pw) => {
      const hash = await hashPw(pw);
      localStorage.setItem(`sc-auth:${userName.toLowerCase()}`, hash);
    };

    const sbUserExists = (userName) => {
      return !!localStorage.getItem(`sc-auth:${userName.toLowerCase()}`);
    };

    // ── AuthScreen ──────────────────────────────────────────────────
    function AuthScreen({onLogin}){
      const [mode,setMode]=useState('login');
      const [user,setUser]=useState('');
      const [pw,setPw]=useState('');
      const [pw2,setPw2]=useState('');
      const [err,setErr]=useState('');
      const [busy,setBusy]=useState(false);
      const [show,setShow]=useState(false);

      const doRegister = async () => {
        const u = user.trim();
        if(u.length<2) return setErr('ユーザー名は2文字以上にしてね');
        if(pw.length<4) return setErr('パスワードは4文字以上にしてね');
        if(pw!==pw2) return setErr('パスワードが一致しないよ');
        setBusy(true); setErr('');
        if(sbUserExists(u)){ setBusy(false); return setErr('そのユーザー名はすでに使われているよ'); }
        await sbRegister(u, pw);
        window.setSession(u);
        onLogin(u);
      };

      const doLogin = async () => {
        const u = user.trim();
        if(!u||!pw) return setErr('ユーザー名とパスワードを入力してね');
        setBusy(true); setErr('');
        if(!sbUserExists(u)){ setBusy(false); return setErr('ユーザーが見つからないよ'); }
        const ok = await sbCheckAuth(u, pw);
        if(!ok){ setBusy(false); return setErr('パスワードが違うよ'); }
        window.setSession(u);
        onLogin(u);
      };

      return(
        <div style={{minHeight:'100vh',background:C.bg,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'24px',maxWidth:420,margin:'0 auto'}}>
          <div style={{fontSize:56,marginBottom:6}}>🌸</div>
          <div style={{fontFamily:"'Nunito',sans-serif",fontWeight:900,fontSize:28,color:C.text,marginBottom:2}}>SleepCoach</div>
          <div style={{fontFamily:"'Nunito',sans-serif",fontSize:13,color:C.sub,marginBottom:28}}>あなた専用の睡眠コーチ</div>
          <div style={{width:'100%',...card({marginBottom:16})}}>
            <div style={{display:'flex',gap:6,marginBottom:22,background:C.bg,borderRadius:14,padding:4}}>
              {[['login','ログイン'],['register','新規登録']].map(([m,l])=>(
                <button key={m} onClick={()=>{setMode(m);setErr('');}} style={{flex:1,padding:'10px',borderRadius:10,border:'none',cursor:'pointer',fontFamily:"'Nunito',sans-serif",fontWeight:900,fontSize:13,background:mode===m?`linear-gradient(135deg,${C.pink},${C.lav})`:'transparent',color:mode===m?'#fff':C.sub}}>{l}</button>
              ))}
            </div>
            <div style={{marginBottom:14}}>
              <div style={{fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:12,color:C.sub,marginBottom:6}}>ユーザー名</div>
              <input style={inputS} placeholder="例: taro123" value={user} onChange={e=>setUser(e.target.value)}/>
            </div>
            <div style={{marginBottom:mode==='register'?14:0}}>
              <div style={{fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:12,color:C.sub,marginBottom:6}}>パスワード</div>
              <div style={{position:'relative'}}>
                <input style={{...inputS,paddingRight:48}} placeholder="4文字以上" type={show?'text':'password'} value={pw} onChange={e=>setPw(e.target.value)}/>
                <button onClick={()=>setShow(v=>!v)} style={{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',cursor:'pointer',fontSize:18}}>{show?'🙈':'👁️'}</button>
              </div>
            </div>
            {mode==='register'&&(
              <div>
                <div style={{fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:12,color:C.sub,marginBottom:6}}>パスワード（確認）</div>
                <input style={inputS} placeholder="もう一度入力" type={show?'text':'password'} value={pw2} onChange={e=>setPw2(e.target.value)}/>
              </div>
            )}
            {err&&<div style={{marginTop:12,background:'#fff0f0',border:'1.5px solid #ffb3b3',borderRadius:12,padding:'10px 14px',fontFamily:"'Nunito',sans-serif",fontSize:13,color:'#cc4444',fontWeight:700}}>{err}</div>}
            <button onClick={mode==='login'?doLogin:doRegister} disabled={busy} style={{...bigBtn(`linear-gradient(135deg,${C.pink},${C.lav})`),marginTop:16,opacity:busy?0.6:1}}>

            {Array(daysInMonth).fill(null).map((_,i)=>{
              const d=i+1;
              const dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
              const rec=recMap[dateStr];
              const col=rec?sleepColor(rec.sleep_hours):null;
              const isToday=dateStr===today;
              const isSelected=detail?.date===dateStr;
              const dayStamps=(stampData[dateStr]||[]).slice(0,2);
              return(
                <button key={d} onClick={()=>{setDetail(rec?{...rec,date:dateStr}:{date:dateStr});setShowStampPicker(false);}}
                  style={{aspectRatio:'1',borderRadius:10,border:isSelected?`2px solid ${C.pinkD}`:isToday?`2px solid ${C.lav}`:'2px solid transparent',background:col?col+'33':isToday?C.lavLight:C.card,cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:0,padding:2}}>
                  <div style={{fontFamily:"'Nunito',sans-serif",fontWeight:isToday?900:700,fontSize:11,color:isToday?C.lavD:C.text}}>{d}</div>
                  {dayStamps.length>0?(
                    <div style={{fontSize:10,lineHeight:1}}>{dayStamps.map(sid=>{const s=ALL_STAMPS.find(x=>x.id===sid);return s?s.emoji:''}).join('')}</div>
                  ):rec?(
                    <div style={{width:5,height:5,borderRadius:'50%',background:col}}/>
                  ):null}
                </button>
              );
            })}
          </div>

          {/* 凡例 */}
          <div style={{display:'flex',gap:10,marginTop:12,justifyContent:'center'}}>
            {[[C.mintD,'7h以上'],[C.pinkD,'6h未満'],['#fbbf24','6〜7h']].map(([c,l])=>(
              <div key={l} style={{display:'flex',alignItems:'center',gap:4}}>
                <div style={{width:8,height:8,borderRadius:'50%',background:c}}/>
                <span style={{fontFamily:"'Nunito',sans-serif",fontSize:10,color:C.sub}}>{l}</span>
              </div>
            ))}
          </div>

          {/* 詳細パネル */}
          {detail&&(
            <div style={{...card({marginTop:14}),background:`linear-gradient(135deg,${C.pinkLight},${C.lavLight})`,border:`1.5px solid ${C.pink}`}}>
              <div style={{fontFamily:"'Nunito',sans-serif",fontWeight:900,fontSize:14,color:C.text,marginBottom:10}}>{detail.date?.replace(/-/g,'/')} の記録</div>

              {/* スタンプ表示・追加 */}
              <div style={{marginBottom:12}}>
                <div style={{fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:11,color:C.sub,marginBottom:6}}>📌 この日のスタンプ</div>
                <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:8}}>
                  {(stampData[detail.date]||[]).map(sid=>{
                    const s=ALL_STAMPS.find(x=>x.id===sid);
                    if(!s) return null;
                    return(
                      <button key={sid} onClick={()=>toggleStamp(detail.date,sid)}
                        style={{display:'flex',alignItems:'center',gap:4,padding:'4px 10px',borderRadius:20,border:`1.5px solid ${C.pinkD}`,background:C.pinkLight,cursor:'pointer',fontFamily:"'Nunito',sans-serif",fontSize:12,fontWeight:700,color:C.text}}>
                        {s.emoji} {s.label} ✕
                      </button>
                    );
                  })}
                  <button onClick={()=>setShowStampPicker(v=>!v)}
                    style={{padding:'4px 10px',borderRadius:20,border:`1.5px dashed ${C.border}`,background:'transparent',cursor:'pointer',fontFamily:"'Nunito',sans-serif",fontSize:12,fontWeight:700,color:C.sub}}>
                    ＋ スタンプ追加
                  </button>
                </div>

                {/* スタンプピッカー */}
                {showStampPicker&&(
                  <div style={{background:C.bg,borderRadius:14,padding:10,border:`1.5px solid ${C.border}`}}>
                    <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                      {availableStamps.map(s=>{
                        const active=(stampData[detail.date]||[]).includes(s.id);
                        return(
                          <button key={s.id} onClick={()=>toggleStamp(detail.date,s.id)}
                            style={{display:'flex',flexDirection:'column',alignItems:'center',padding:'6px 8px',borderRadius:12,border:`1.5px solid ${active?C.pinkD:C.border}`,background:active?C.pinkLight:C.card,cursor:'pointer',minWidth:48}}>
                            <div style={{fontSize:20}}>{s.emoji}</div>
                            <div style={{fontFamily:"'Nunito',sans-serif",fontSize:9,color:C.sub,marginTop:2}}>{s.label}</div>
                          </button>
                        );
                      })}
                    </div>
                  </div>
                )}
              </div>

              {/* 睡眠記録 */}
              {detail.bed_time?(
                <div>
                  <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
                    <div>
                      <span style={{fontFamily:"'Nunito',sans-serif",fontWeight:900,fontSize:32,color:C.text}}>{Math.floor(detail.sleep_hours)}</span>
                      <span style={{color:C.sub,fontSize:13}}>時間</span>
                    </div>
                    <div style={{textAlign:'right',color:C.sub,fontSize:12}}>
                      <div>{detail.bed_time} → {detail.wake_time}</div>
                      {detail.focus&&<div style={{fontSize:18,marginTop:2}}>{'😵😐🧠🧠⚡'[detail.focus-1]} {'😔😐😊😊🥳'[detail.mood-1]}</div>}
                    </div>
                  </div>
                  <button onClick={()=>{setLogDate(detail.date);goLog();}} style={{...bigBtn(`linear-gradient(135deg,${C.pink},${C.lav})`),padding:'10px',fontSize:13}}>✏️ この日を編集</button>
                </div>
              ):(
                <div style={{textAlign:'center',padding:'8px 0'}}>
                  <div style={{color:C.sub,fontSize:13,marginBottom:10}}>まだ記録がないよ</div>
                  <button onClick={()=>{setLogDate(detail.date);goLog();}} style={{...bigBtn(`linear-gradient(135deg,${C.pink},${C.lav})`),padding:'10px',fontSize:13}}>＋ この日を記録する</button>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ── LogScreen ───────────────────────────────────────────────────
    function LogScreen({records,setRecords,userName,goHome,logDate}){
      const [stepN,setStepN]=useState(0);
      const [targetDate,setTargetDate]=useState(logDate||todayStr());
      const [bedH,setBedH]=useState(23);const [bedM,setBedM]=useState(0);
      const [wakeH,setWakeH]=useState(7);const [wakeM,setWakeM]=useState(0);
      const [drowsy,setDrowsy]=useState(null);
      const [focus,setFocus]=useState(null);
      const [mood,setMood]=useState(null);
      const [caffeine,setCaffeine]=useState(null);
      const [phone,setPhone]=useState(null);
      const [exercise,setExercise]=useState(null);
      const [bath,setBath]=useState(null);
      const [saving,setSaving]=useState(false);
      const [done,setDone]=useState(false);

      useEffect(()=>{
        const existing=records.find(r=>r.date===targetDate);
        if(existing){
          const[bh,bm]=existing.bed_time.split(':').map(Number);
          const[wh,wm]=existing.wake_time.split(':').map(Number);
          setBedH(bh);setBedM(bm);setWakeH(wh);setWakeM(wm);
          setDrowsy(existing.drowsy);setFocus(existing.focus);setMood(existing.mood);
          setCaffeine(existing.caffeine);setPhone(existing.phone);setExercise(existing.exercise);setBath(existing.bath);
        }
      },[targetDate]);

      const bedTime=fmt(bedH,bedM),wakeTime=fmt(wakeH,wakeM);
      const sleepHours=diffH(bedTime,wakeTime),sleepHM=diffHM(bedTime,wakeTime);

      const submit=async()=>{
        setSaving(true);
        const entry={user_name:userName,date:targetDate,bed_time:bedTime,wake_time:wakeTime,sleep_hours:sleepHours,drowsy,focus,mood,caffeine,phone,exercise,bath};
        await sbSaveRecord(entry);
        const updated=[...records.filter(r=>r.date!==targetDate),entry].sort((a,b)=>a.date>b.date?1:-1);
        setRecords(updated);
        setSaving(false); setDone(true);
      };

      if(done) return(
        <div style={{textAlign:'center',padding:'60px 0'}}>
          <div style={{fontSize:72,marginBottom:8}}>🌟</div>
          <div style={{fontFamily:"'Nunito',sans-serif",fontWeight:900,fontSize:26,color:C.text,marginBottom:8}}>記録完了！</div>
          <div style={{fontFamily:"'Nunito',sans-serif",color:C.sub,fontSize:14,marginBottom:4}}>{targetDate.replace(/-/g,'/')}の記録</div>
          <div style={{fontFamily:"'Nunito',sans-serif",color:C.sub,fontSize:14,marginBottom:28}}>{fmtSleep(sleepHM)}の睡眠を記録したよ 🌙</div>
          <button onClick={goHome} style={{...bigBtn(`linear-gradient(135deg,${C.pink},${C.lav})`),width:'auto',padding:'14px 36px'}}>ホームへ 🏠</button>
        </div>
      );

      const arrBtn={background:'none',border:'none',fontSize:22,cursor:'pointer',color:C.pinkD,padding:'6px 12px'};
      const numBox={fontFamily:"'Nunito',sans-serif",fontWeight:900,fontSize:40,color:C.text,background:C.bg,borderRadius:14,padding:'8px 12px',border:`2px solid ${C.border}`,minWidth:62,textAlign:'center'};
      const TW=({label,h,setH,m,setM})=>(
        <div style={{flex:1,textAlign:'center'}}>
          <div style={{fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:12,color:C.sub,marginBottom:10}}>{label}</div>
          <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:2}}>
            <div style={{display:'flex',flexDirection:'column',alignItems:'center'}}>
              <button onClick={()=>setH(h=>(h+1)%24)} style={arrBtn}>▲</button>
              <div style={numBox}>{String(h).padStart(2,'0')}</div>
              <button onClick={()=>setH(h=>(h-1+24)%24)} style={arrBtn}>▼</button>
            </div>
            <div style={{color:C.pinkD,fontSize:28,fontWeight:900,paddingBottom:6}}>:</div>
            <div style={{display:'flex',flexDirection:'column',alignItems:'center'}}>
              <button onClick={()=>setM(m=>(m+5)%60)} style={arrBtn}>▲</button>
              <div style={numBox}>{String(m).padStart(2,'0')}</div>
              <button onClick={()=>setM(m=>(m-5+60)%60)} style={arrBtn}>▼</button>
            </div>
          </div>
        </div>
      );

      const steps=[
        { title:'日付と就寝・起床時間 🌙', content:(
          <div>
            <div style={{marginBottom:16}}>
              <div style={{fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:12,color:C.sub,marginBottom:6}}>📅 記録する日</div>
              <input type="date" value={targetDate} max={todayStr()} onChange={e=>setTargetDate(e.target.value)} style={{...inputS,fontSize:14}}/>
            </div>
            <div style={{display:'flex',gap:16,marginBottom:20}}>
              <TW label="就寝" h={bedH} setH={setBedH} m={bedM} setM={setBedM}/>
              <TW label="起床" h={wakeH} setH={setWakeH} m={wakeM} setM={setWakeM}/>
            </div>
            <div style={{textAlign:'center',background:`linear-gradient(135deg,${C.pink}33,${C.lav}33)`,borderRadius:16,padding:14}}>
              <span style={{fontFamily:"'Nunito',sans-serif",color:C.sub,fontSize:13}}>睡眠時間 </span>
              <span style={{fontFamily:"'Nunito',sans-serif",fontWeight:900,fontSize:26,color:C.text}}>{fmtSleep(sleepHM)}</span>
            </div>
          </div>
        ), next:()=>setStepN(1) },
        { title:'今朝の体調 ☀️', content:(
          <div>
            <ScoreRow label="😴 眠気（低→高）" value={drowsy} set={setDrowsy} opts={['😴','😪','😑','🙂','😊']}/>
            <ScoreRow label="⚡ 集中力（低→高）" value={focus} set={setFocus} opts={['💀','😵','😐','🧠','⚡️']}/>
            <ScoreRow label="🌸 気分（低→高）" value={mood} set={setMood} opts={['😭','😔','😐','😊','🥳']}/>
          </div>
        ), next:()=>setStepN(2), disabled:!drowsy||!focus||!mood },
        { title:'昨日の生活 🌿', content:(
          <div>
            <div style={{marginBottom:16}}>
              <div style={{fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:13,color:C.sub,marginBottom:8}}>☕ カフェイン</div>
              <div style={{display:'flex',gap:8}}>{[{v:'none',l:'なし'},{v:'morning',l:'午前のみ'},{v:'evening',l:'夕方以降も'}].map(o=>pillBtn(caffeine===o.v,o.v,setCaffeine,o.l))}</div>
            </div>
            <div style={{marginBottom:16}}>
              <div style={{fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:13,color:C.sub,marginBottom:8}}>📱 寝る前スマホ</div>
              <div style={{display:'flex',gap:8}}>{[{v:'none',l:'なし'},{v:'short',l:'30分未満'},{v:'long',l:'30分以上'}].map(o=>pillBtn(phone===o.v,o.v,setPhone,o.l,C.lav,C.lavD))}</div>
            </div>
            <div>
              <div style={{fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:13,color:C.sub,marginBottom:8}}>🏃 運動</div>
              <div style={{display:'flex',gap:8}}>{[{v:'none',l:'なし'},{v:'light',l:'軽め'},{v:'hard',l:'がっつり'}].map(o=>pillBtn(exercise===o.v,o.v,setExercise,o.l,C.mint,C.mintD))}</div>
            </div>
          </div>
        ), next:()=>setStepN(3), disabled:!caffeine||!phone||!exercise },
        { title:'お風呂 🛁', content:(
          <div>
            <div style={{fontFamily:"'Nunito',sans-serif",fontSize:13,color:C.sub,lineHeight:1.7,marginBottom:16,background:`${C.sky}44`,borderRadius:14,padding:12}}>就寝の何時間前に入った？朝風呂派も選べるよ 🌡️</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
              {BATH_OPTIONS.map(o=>(
                <button key={o.v} onClick={()=>setBath(o.v)} style={{padding:'12px 6px',borderRadius:50,border:`2px solid ${bath===o.v?C.lavD:C.border}`,background:bath===o.v?C.lav:C.card,color:bath===o.v?C.text:C.sub,fontSize:13,fontFamily:"'Nunito',sans-serif",fontWeight:bath===o.v?800:600,cursor:'pointer'}}>{o.label}</button>
              ))}
            </div>
          </div>
        ), next:submit, disabled:!bath||saving, lastStep:true },
      ];

      const s=steps[stepN];
      return(
        <div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
            <div style={{fontFamily:"'Nunito',sans-serif",fontWeight:900,fontSize:20,color:C.text}}>{s.title}</div>
            <div style={{fontFamily:"'Nunito',sans-serif",fontSize:12,color:C.sub,fontWeight:700}}>{stepN+1}/4</div>
          </div>
          <div style={{display:'flex',gap:6,marginBottom:22}}>
            {[0,1,2,3].map(i=><div key={i} style={{height:6,flex:1,borderRadius:6,background:i<stepN?C.mintD:i===stepN?C.pinkD:C.border}}/>)}
          </div>
          {s.content}
          <button onClick={s.next} disabled={s.disabled} style={{...bigBtn(`linear-gradient(135deg,${C.pink},${C.lav})`),marginTop:16,opacity:s.disabled?0.4:1,cursor:s.disabled?'not-allowed':'pointer'}}>
            {saving?'保存中…':s.lastStep?'記録する ✓':'次へ →'}
          </button>
        </div>
      );
    }

    // ── StatsScreen ─────────────────────────────────────────────────
    function StatsScreen({records}){
      const week=records.slice(-7);
      const maxH=week.length?Math.max(...week.map(r=>r.sleep_hours||0),9):9;
      const avgRaw=records.length?(records.reduce((a,r)=>a+(r.sleep_hours||0),0)/records.length):0;
      const avgFocus=records.filter(r=>r.focus).length?(records.filter(r=>r.focus).reduce((a,r)=>a+r.focus,0)/records.filter(r=>r.focus).length).toFixed(1):'-';
      const avgDisplay=(()=>{const h=Math.floor(avgRaw),m=Math.round((avgRaw-h)*60);return m>0?`${h}時間${m}分`:`${h}時間`;})();
      return(
        <div>
          <div style={{fontFamily:"'Nunito',sans-serif",fontWeight:900,fontSize:24,color:C.text,marginBottom:18}}>統計 & インサイト 📊</div>
          <div style={{display:'flex',gap:10,marginBottom:16}}>
            {[{label:'平均睡眠',val:avgDisplay,c:C.pink},{label:'平均集中力',val:`${avgFocus}/5`,c:C.lav},{label:'記録日数',val:`${records.length}日`,c:C.mint}].map(s=>(
              <div key={s.label} style={{flex:1,...card({padding:12,marginBottom:0}),textAlign:'center',border:`1.5px solid ${s.c}`}}>
                <div style={{fontFamily:"'Nunito',sans-serif",fontWeight:900,fontSize:16,color:C.text}}>{s.val}</div>
                <div style={{fontFamily:"'Nunito',sans-serif",fontSize:10,color:C.sub,marginTop:2,fontWeight:700}}>{s.label}</div>
              </div>
            ))}
          </div>
          <div style={card()}>
            <div style={{fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:12,color:C.sub,marginBottom:16}}>直近7日間の睡眠 🌙</div>
            {week.length===0?(
              <div style={{color:C.sub,textAlign:'center',padding:'20px 0',fontSize:13}}>まだデータがないよ 🌱</div>
            ):(
              <div style={{display:'flex',alignItems:'flex-end',gap:6,height:110}}>
                {week.map((r,i)=>{const pct=(r.sleep_hours||0)/maxH,col=r.sleep_hours>=7?C.mintD:r.sleep_hours>=6?'#fbbf24':C.pinkD;return(
                  <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:4}}>
                    <div style={{fontFamily:"'Nunito',sans-serif",fontSize:9,fontWeight:800,color:col}}>{Math.floor(r.sleep_hours)}h</div>
                    <div style={{width:'100%',borderRadius:8,background:col,height:`${pct*85}px`,minHeight:4}}/>
                    <div style={{fontFamily:"'Nunito',sans-serif",fontSize:8,color:C.sub,fontWeight:700}}>{r.date.slice(5).replace('-','/')}</div>
                  </div>
                );})}
              </div>
            )}
          </div>
          {records.length<3&&<div style={{textAlign:'center',fontFamily:"'Nunito',sans-serif",fontSize:12,color:C.sub,marginTop:8}}>あと{3-records.length}日分でインサイト解放 🔮</div>}
        </div>
      );
    }

    // ── TypesScreen ─────────────────────────────────────────────────

        <div>
          <div style={{fontFamily:"'Nunito',sans-serif",fontWeight:900,fontSize:24,color:C.text,marginBottom:4}}>睡眠タイプ一覧 💤</div>
          <div style={{fontFamily:"'Nunito',sans-serif",fontSize:13,color:C.sub,marginBottom:16}}>全{ALL_TYPES.length}種類</div>
          {records.length<5&&(
            <div style={{...card({marginBottom:16}),background:C.lavLight,border:`1.5px solid ${C.lav}`,textAlign:'center',padding:16}}>
              <div style={{fontSize:28,marginBottom:4}}>🔮</div>
              <div style={{fontFamily:"'Nunito',sans-serif",fontWeight:700,fontSize:13,color:C.sub}}>あと{5-records.length}日分記録するとタイプ判定！</div>
            </div>
          )}
          {ALL_TYPES.map(t=>{
            const isMe=myType&&myType.label===t.label;

                {isMe&&<div style={{position:'absolute',top:10,right:12,background:t.color,color:'#fff',borderRadius:20,padding:'2px 10px',fontFamily:"'Nunito',sans-serif",fontWeight:900,fontSize:10}}>あなた ✓</div>}
                <div style={{display:'flex',alignItems:'flex-start',gap:12}}>
                  <div style={{fontSize:32,flexShrink:0}}>{t.emoji}</div>

                    <div style={{display:'inline-block',background:t.color+'22',border:`1px solid ${t.color}`,borderRadius:20,padding:'2px 10px',fontFamily:"'Nunito',sans-serif",fontSize:10,color:C.sub,fontWeight:700}}>条件: {t.cond}</div>

      );

    // ── ミッション全リスト ───────────────────────────────────────────
    const ALL_MISSIONS = [
      // 毎日系
      {id:'d1', emoji:'🌙', label:'今日23時台に就寝する', period:'daily', check:(r,today)=>r.some(x=>x.date===today&&parseInt(x.bed_time)===23)},
      {id:'d2', emoji:'☀️', label:'今日7時前に起床する', period:'daily', check:(r,today)=>r.some(x=>x.date===today&&parseInt(x.wake_time)<=7)},

    ];

    // 今週の月曜日を取得
    function getWeekMonday(today) {
      const d = new Date(today);
      const day = d.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      d.setDate(d.getDate() + diff);
      return d.toISOString().slice(0,10);
    }

    // 今月の1日を取得
    function getMonthStart(today) {
      return today.slice(0,7) + '-01';
    }

    // 期間ごとにシードを分けてランダム選出
    function getDailyMissions(today) {
      const dailyMissions  = ALL_MISSIONS.filter(m=>m.period==='daily');
      const weeklyMissions = ALL_MISSIONS.filter(m=>m.period==='weekly');
      const monthlyMissions= ALL_MISSIONS.filter(m=>m.period==='monthly');

      const shuffle = (arr, seed) => {
        let n = parseInt(seed.replace(/-/g,''));
        const a=[...arr];
        for(let i=a.length-1;i>0;i--){n=(n*1664525+1013904223)&0xffffffff;const j=Math.abs(n)%(i+1);[a[i],a[j]]=[a[j],a[i]];}
        return a;
      };

      // 今日のシード → 毎日変わる
      const dailySeed   = today;
      // 今週月曜のシード → 毎週月曜に変わる
      const weeklySeed  = getWeekMonday(today);
      // 今月1日のシード → 毎月1日に変わる
      const monthlySeed = getMonthStart(today);

      return [
        ...shuffle(dailyMissions,   dailySeed  ).slice(0,2),
        ...shuffle(weeklyMissions,  weeklySeed ).slice(0,2),
        ...shuffle(monthlyMissions, monthlySeed).slice(0,1),
      ];
    }

    // ── コイン管理 ──────────────────────────────────────────────────
    const COIN_KEY = (u) => `sc-coins:${u.toLowerCase()}`;

    function loadCoins(userName) {
      return parseInt(localStorage.getItem(COIN_KEY(userName))||'0');
    }

    function saveCoins(userName, amount) {
      localStorage.setItem(COIN_KEY(userName), String(amount));
    }

    function getCoinValue(period) {
      if(period==='daily') return 1;
      if(period==='weekly') return 3;
      return 10;
    }

    // 当日記録コイン付与チェック
    function checkAndGrantRecordCoin(userName, records, today) {
      const grantKey = `sc-record-coin:${userName}:${today}`;
      if(localStorage.getItem(grantKey)) return 0; // 既に付与済み
      const hasToday = records.some(r=>r.date===today);
      if(!hasToday) return 0;
      const newCoins = loadCoins(userName) + 1;
      saveCoins(userName, newCoins);
      localStorage.setItem(grantKey, '1');
      return 1;
    }

      const [newCoins, setNewCoins] = useState({});

      // 当日記録コイン付与
      useEffect(()=>{
        const gained = checkAndGrantRecordCoin(userName, records, today);
        if(gained > 0) {
          setCoins(loadCoins(userName));
          setRecordCoinMsg('📝 今日の記録で🪙+1コイン獲得！');
          setTimeout(()=>setRecordCoinMsg(''), 3000);
        }
      },[records]);

      // ミッション達成でコイン付与
      useEffect(()=>{
        let total = loadCoins(userName);
        const gained = {};
        missions.forEach(m=>{
          const done = m.check(records, today);
          const wasNotDone = !prevDone[m.id];
          if(done && wasNotDone) {
            const val = getCoinValue(m.period);
            const grantKey = `sc-grant:${userName}:${today}:${m.id}`;
            if(!localStorage.getItem(grantKey)) {
              total += val;
              localStorage.setItem(grantKey, '1');
              gained[m.id] = val;
            }
          }
        });
        if(Object.keys(gained).length > 0) {
          saveCoins(userName, total);
          setCoins(total);
          setNewCoins(gained);
          setTimeout(()=>setNewCoins({}), 2000);
        }
        const doneMap = {};
        missions.forEach(m=>{ doneMap[m.id]=m.check(records,today); });
        setPrevDone(doneMap);

              📝 当日記録+1 · 今日ミッション+1 · 今週+3 · 今月+10

          {/* 更新タイミング案内 */}
          <div style={{...card({marginBottom:14,padding:'10px 14px'}),background:C.lavLight,border:`1.5px solid ${C.lav}`}}>

          {['daily','weekly','monthly'].map(period=>{

                      <span style={{fontFamily:"'Nunito',sans-serif",fontWeight:700,fontSize:12,color:C.text}}>{s.label}</span>
                      <span style={{fontSize:10,color:C.mintD}}>✓</span>
                    </div>
                  ))}
                </div>
              </div>
              {/* 購入スタンプ */}
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8}}>
                {shopStamps.map(s=>{
                  const isOwned = ownedStamps.includes(s.id);
                  return(
                    <div key={s.id} style={{...card({marginBottom:0,padding:10}),border:isOwned?`1.5px solid ${C.mintD}`:`1.5px solid ${C.border}`,background:isOwned?`${C.mint}22`:C.card,textAlign:'center'}}>
                      <div style={{fontSize:24,marginBottom:4}}>{s.emoji}</div>
                      <div style={{fontFamily:"'Nunito',sans-serif",fontWeight:700,fontSize:11,color:C.text,marginBottom:6}}>{s.label}</div>
                      {isOwned?(
                        <div style={{fontFamily:"'Nunito',sans-serif",fontSize:10,color:C.mintD,fontWeight:800}}>✓ 所持済み</div>
                      ):(
                        <button onClick={()=>buyStamp(s)} style={{width:'100%',padding:'5px',borderRadius:10,border:'none',background:`linear-gradient(135deg,${C.pink},${C.lav})`,fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:10,color:'#fff',cursor:'pointer'}}>🪙{s.price}枚</button>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      );
    }
    function App(){
      const [userName,setUserName]=useState(null);
      const [records,setRecords]=useState([]);
      const [screen,setScreen]=useState('home');
      const [booting,setBooting]=useState(true);
      const [logDate,setLogDate]=useState(null);
      const [currentTheme,setCurrentTheme]=useState(THEMES[0]);
      const [coins,setCoins]=useState(0);

      useEffect(()=>{
        (async()=>{
          const saved=window.getSession();
          if(saved&&saved!==''){
            const recs=await sbGetRecords(saved);
            setUserName(saved);
            setRecords(recs);
            const theme=loadTheme(saved);
            setCurrentTheme(theme);
            Object.assign(C,theme);
            setCoins(loadCoins(saved));
          }
          setBooting(false);
        })();
      },[]);

      useEffect(()=>{ Object.assign(C,currentTheme); },[currentTheme]);

      const handleLogin=async(u)=>{
        const recs=await sbGetRecords(u);
        setRecords(recs);
        setUserName(u);
        const theme=loadTheme(u);
        setCurrentTheme(theme);
        Object.assign(C,theme);
        setCoins(loadCoins(u));
        setScreen('home');
      };

      const handleLogout=()=>{ window.clearSession(); setUserName(null); setRecords([]); setScreen('home'); };

      const isAdmin = userName === ADMIN_USER;

      const nav=[
        {id:'home',label:'ホーム',icon:'🏠'},
        {id:'log',label:'記録',icon:'✏️'},
        {id:'calendar',label:'カレンダー',icon:'📅'},
        {id:'stats',label:'統計',icon:'📊'},
        {id:'types',label:'タイプ',icon:'💤'},
        {id:'missions',label:'ミッション',icon:'🎯'},
        {id:'shop',label:'ショップ',icon:'🛍️'},
        ...(isAdmin?[{id:'admin',label:'管理',icon:'👑'}]:[]),
      ];

      if(booting) return(<div style={{minHeight:'100vh',background:C.bg,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:12}}><div style={{fontSize:48}}>🌸</div><div style={{fontFamily:"'Nunito',sans-serif",fontWeight:800,color:C.sub,fontSize:14}}>読み込み中…</div></div>);
      if(!userName) return <AuthScreen onLogin={handleLogin}/>;

      return(
        <div style={{minHeight:'100vh',background:C.bg,display:'flex',flexDirection:'column',maxWidth:420,margin:'0 auto'}}>
          <div style={{position:'fixed',top:0,left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:420,background:'rgba(255,249,245,0.93)',backdropFilter:'blur(16px)',borderBottom:`1.5px solid ${C.border}`,padding:'13px 20px 10px',zIndex:100,boxSizing:'border-box'}}>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <div style={{fontSize:22}}>🌸</div>
              <div style={{fontFamily:"'Nunito',sans-serif",fontWeight:900,fontSize:20,color:C.text}}>SleepCoach</div>
              <div style={{marginLeft:'auto',display:'flex',gap:6,alignItems:'center'}}>
                {isAdmin&&<div style={{background:'#ffd70044',borderRadius:50,padding:'3px 10px',fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:11,color:'#b8860b'}}>👑 管理者</div>}
                <div style={{background:'#ffd70033',borderRadius:50,padding:'3px 10px',fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:11,color:'#b8860b'}}>🪙 {loadCoins(userName)}</div>
                <div style={{background:`${C.lav}55`,borderRadius:50,padding:'3px 10px',fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:11,color:C.lavD}}>👤 {userName}</div>
                <div style={{background:`${C.pink}44`,borderRadius:50,padding:'3px 10px',fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:11,color:C.pinkD}}>{records.length}日</div>
              </div>
            </div>
          </div>

          <div style={{flex:1,padding:'74px 18px 86px',overflowY:'auto'}}>
            {screen==='home'     && <HomeScreen records={records} goLog={()=>{setLogDate(null);setScreen('log');}} userName={userName} onLogout={handleLogout} goTypes={()=>setScreen('types')}/>}
            {screen==='log'      && <LogScreen  records={records} setRecords={setRecords} userName={userName} goHome={()=>setScreen('home')} logDate={logDate}/>}
            {screen==='calendar' && <CalendarScreen records={records} goLog={()=>setScreen('log')} setLogDate={setLogDate} userName={userName}/>}
            {screen==='stats'    && <StatsScreen records={records}/>}
            {screen==='types'    && <TypesScreen records={records}/>}
            {screen==='missions' && <MissionsScreen records={records} userName={userName}/>}
            {screen==='shop'     && <ShopScreen userName={userName} coins={coins} setCoins={setCoins} currentTheme={currentTheme} setCurrentTheme={setCurrentTheme}/>}
            {screen==='admin'    && isAdmin && <AdminScreen/>}
          </div>

          <div style={{position:'fixed',bottom:0,left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:420,background:'rgba(255,249,245,0.96)',backdropFilter:'blur(16px)',borderTop:`1.5px solid ${C.border}`,display:'flex',padding:'8px 0 18px',zIndex:100,boxSizing:'border-box'}}>
            {nav.map(n=>{const active=screen===n.id;return(
              <button key={n.id} onClick={()=>setScreen(n.id)} style={{flex:1,background:'none',border:'none',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:2,padding:'4px 0'}}>
                <div style={{fontSize:16,filter:active?'none':'grayscale(1) opacity(0.3)'}}>{n.icon}</div>
                <div style={{fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:8,color:active?C.pinkD:C.sub}}>{n.label}</div>
                {active&&<div style={{width:18,height:3,borderRadius:2,background:`linear-gradient(90deg,${C.pink},${C.lav})`,marginTop:1}}/>}
              </button>
            );})}
          </div>
        </div>
      );
    }

    const root=ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
  <script>
    if('serviceWorker' in navigator){
      window.addEventListener('load',()=>{
        navigator.serviceWorker.register('./sw.js').then(reg=>{
          reg.addEventListener('updatefound',()=>{
            const nw=reg.installing;
            nw.addEventListener('statechange',()=>{ if(nw.state==='installed'&&navigator.serviceWorker.controller) nw.postMessage({type:'SKIP_WAITING'}); });
          });
        });
        navigator.serviceWorker.addEventListener('controllerchange',()=>window.location.reload());
      });
    }
  </script>
</body>
</html>
